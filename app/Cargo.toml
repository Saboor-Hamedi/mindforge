[package]
name = "app"
version = "0.1.18"
edition = "2021"
default-run = "app"

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "publish"
path = "src/bin/publish.rs"


[dependencies]
core = { path = "../core" }
webscan = { path = "../webscan" }
eframe = { version = "0.31", default-features = true }
fastrand = "2"
chrono = "0.4"
anyhow = "1.0"
directories = "5"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
egui_term = "0.1"
rmpv = "1.3.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
